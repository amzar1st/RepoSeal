name: RepoSeal contract checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GENVM_VERSION: v0.6.0-rc3
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install pinned contract tooling
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt
      - name: Run direct-mode contract tests
        run: pytest -q
      - name: Validate the Intelligent Contract
        run: genvm-lint check contracts/reposeal.py
